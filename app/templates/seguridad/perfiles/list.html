{% extends "layout.html" %}

{% block title %}Lista de Perfiles{% endblock %}

{% block body %}

    <h1>Listado de Perfiles</h1>

    <a href="{{ url_for('perfiles.create') }}" class="btn btn-primary">Nuevo Perfil</a>

    <div class="contenedor-tabla">
        <table id="tablaPerfiles" class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Perfil</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody>
                {% for perfil in perfiles %}
                    <tr>
                        <td>{{ perfil[0] }}</td>
                        <td>{{ perfil[1] }}</td>
                        <td>
                            <a class="btn btn-primary" href="{{ url_for('perfiles.edit', id=perfil[0]) }}">Editar</a>
                            <button class="btn btn-danger" onclick="eliminar(this)">Eliminar</button>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

{% endblock %}

{% block scripts %}

    <script>

        function eliminar(button) {
            const row = button.closest('tr');
            const id = row.cells[0].textContent;

            if (confirm("¿Está seguro de que desea eliminar este perfil?")) {
                fetch("/perfiles/delete", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ id: id })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        row.remove();
                        alert("Perfil eliminado correctamente.");
                    } else {
                        alert("Error al eliminar el perfil.");
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }
        }

    </script>

{% endblock %}
