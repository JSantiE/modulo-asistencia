{% extends "layout.html" %}

{% block title %}Lista de Usuarios{% endblock %}

{% block body %}

    <h1>Datos de Usuario</h1>

    <form class="form" action="/usuarios/datos" method="POST">
        <div>
            <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Apellido Paterno:</label>
                <input type="text" class="form-control" id="apellido-paterno" value="{{ user.apellido_paterno }}" name="apellido_paterno">
            </div>
            <div class="mb-3">
                <label for="message-text" class="col-form-label">Apellido Materno:</label>
                <input type="text" class="form-control" id="apellido-materno" value="{{ user.apellido_materno }}" name="apellido_materno">
            </div>
            <div>
                <label for="message-text" class="col-form-label">Nombres:</label>
                <input type="text" class="form-control" id="nombres" value="{{ user.nombres }}" name="nombres">
            </div>
            <div>
                <label for="message-text" class="col-form-label">Perfil:</label>
                <select class="form-select" aria-label="Default select example" id="perfil-select">
                    <option value="0" selected>Seleccionar</option>
                    {% for perfil in perfiles %}
                        <option value="{{ perfil[0] }}">{{ perfil[1] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div>
            
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/usuarios'">Cancelar</button>
        </div>
    </form>

{% endblock %}

{% block scripts %}


{% endblock %}
